---
# Merge gate for the library. On every pull request and every push to
# `main` it runs the lint set, the compiler over the sources and the
# tests, the test suite over the runner and Node combinations this
# package claims to support, the coverage each of those runs reports
# once the reports are folded together, the lock-drift check, and a
# smoke suite that loads the sources as raw TypeScript. Separate jobs
# rather than one: a flake then costs a rerun of the gate that flaked,
# and the status list says which gate turned the change away.
#
# The lint job calls the `lint` aggregate, so a gate appended to it in
# the Justfile later needs no edit here. That aggregate covers the
# text-quality checks as well, which until now reached a contributor
# only through the pre-commit hooks, and `git commit --no-verify` steps
# around a hook. Their binaries come from three places: the pinned
# composites in proofhouse/github-actions carry vale and tombi,
# Homebrew carries rumdl, yamllint, and editorconfig-checker, and the
# lockfile carries biome and cspell.
#
# Every job installs `just` from a SHA-pinned casey/just release
# tarball and then calls the matching `just <recipe>`, which leaves the
# Justfile as the one answer to what any gate runs.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # uvx runs the license-header gate, and nothing else in this
      # workflow needs uv. A contributor gets the same binary out of
      # the Brewfile.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # The ubuntu-24.04 image ships Homebrew but leaves its prefix off
      # the PATH, so expose the bin and sbin directories before any brew
      # invocation. This runs ahead of the composites below because each
      # of them prepends a directory of its own, which then sits in
      # front of Homebrew's.
      - name: Put Homebrew on the PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      # These two gates read strictly enough that an upstream release
      # shifts findings by itself, so the version each one runs belongs
      # under review like any other pin. The composites fetch verified
      # release archives instead of leaving it to a floating formula.
      # Neither takes a version input here: what they default to is the
      # organization pin.
      - name: Set up vale
        uses: proofhouse/github-actions/.github/actions/setup-vale@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up tombi
        uses: proofhouse/github-actions/.github/actions/setup-tombi@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The image pins an older Homebrew and sets HOMEBREW_NO_AUTO_UPDATE,
      # but `brew bundle` reads formula metadata from the JSON API, which
      # serves current definitions. ca-certificates now declares a `run`
      # install step that the pinned Homebrew cannot parse, failing every
      # formula that depends on it. Update Homebrew itself first.
      - name: Update Homebrew
        run: brew update

      # What is left over once the composites and the lockfile have had
      # their say: rumdl, yamllint, and editorconfig-checker.
      - name: Install Homebrew dependencies
        run: brew bundle install

      # The action reads the packageManager field, so it needs no
      # version input to land on the pnpm this repository pins. It has
      # to come before the Node setup, whose pnpm cache asks the binary
      # where the store lives.
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          cache: pnpm

      # Two of the gates run out of node_modules, so this job wants the
      # dependency tree as much as the test job does.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vale resolves its styles from .vale/, which `vale sync`
      # populates from the Packages list in .vale.ini. Without this
      # lint-prose fails on a missing style rather than on prose.
      - name: Sync Vale styles
        run: just install-tools

      - name: Lint
        run: just lint

  # `just lint` above reaches the compiler too, by way of the TypeScript
  # aggregate. It runs a second time here for the sake of the status
  # list: a type error is the failure a change is most likely to bring,
  # and a reviewer should read it off the check name rather than out of
  # a lint log. A full pass costs well under a second.
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: just typecheck

  lock-check:
    name: lock-check
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          cache: pnpm

      # No install ahead of it: comparing the manifest against the lock
      # is the whole of what the recipe does.
      - name: Check lock drift
        run: just lock-check

  test:
    name: "test (${{ matrix.os }}, node ${{ matrix.node }})"
    runs-on: ${{ matrix.os }}
    # Handing a slot's report to the coverage API calls for the
    # code-quality scope in write mode. Naming any scope at the job
    # level throws the workflow default away rather than extending it,
    # so the two reads this job already leaned on come back with it:
    # contents for the checkout, pull-requests for the lookup the upload
    # action performs when the event is a push.
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - windows-2025
        node:
          - '22.23.2'
          - '24.18.1'
          - '26.5.1'
    steps:
      - name: Harden the runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The bar binds each slot on its own, not the matrix in aggregate.
      # No source file here branches on the platform it runs under, so a
      # runner or a Node release that leaves some line unreached is a
      # finding about the sources rather than grounds for excusing that
      # slot.
      - name: Run tests with coverage
        run: just cover

      # One file, two destinations. The first publishes this slot's
      # numbers under a label naming the runner and the Node release
      # behind them, so a reviewer can tell the twelve apart. The second
      # parks the raw report for the job below and treats a missing file
      # as a failure rather than as an empty upload.
      - name: Upload coverage report
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1.4.1
        with:
          file: coverage/lcov.info
          language: TypeScript
          label: code-coverage/${{ matrix.os }}-node${{ matrix.node }}
          fail-on-error: false

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  # Each slot cleared the bar by itself. What no slot can answer is
  # whether the twelve of them measured the same tree, which is this
  # job's question. The merge levels out what the runners spell
  # differently and then re-checks the totals, so a slot that counted a
  # shorter denominator than the rest surfaces as a mismatch
  # instead of passing unread.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    needs: test
    # The same scopes the slots above needed, for the same reason.
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # The diff step near the end reads the history separating this
      # branch from its base, which a shallow clone does not carry.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # diff-cover arrives from PyPI through uvx, the same route the
      # lint job takes to reuse.
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'
          cache: pnpm

      # The merger ships in the dependency tree. The checker standing
      # behind it asks for nothing but Node.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Twelve artifacts, every one of them holding a file called
      # lcov.info. Merging the downloads into a single directory would
      # leave eleven overwritten, so each lands in a directory named
      # after the artifact and the recipe globs across them.
      - name: Download per-slot coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-data-*
          path: reports/coverage

      - name: Merge coverage and check the merged report
        run: just cover-merge

      # An uncovered line a pull request introduced reads better named
      # than folded into a percentage. diff-cover measures against the
      # base branch, and a pull request checkout holds no tracking ref
      # for it, hence the fetch. Only a pull request has a base ref to
      # fetch, which is what the condition guards.
      - name: Check diff coverage
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          just cover-diff "origin/${{ github.base_ref }}" coverage/merged.info

      - name: Upload combined coverage report
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1.4.1
        with:
          file: coverage/merged.info
          language: TypeScript
          label: code-coverage/combined
          fail-on-error: false

  erasable:
    name: erasable
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.1'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Node's own runner drives this suite, with no vitest and no
      # transform ahead of the modules it loads. An assertion is reached
      # only once the runtime has stripped the types from the public
      # entry point and from everything behind it. Compiled first, the
      # same files would hide a construct the runtime cannot erase.
      - name: Run the erasable suite
        run: just test-erasable
